services:
  - type: web
    name: videovault-server
    runtime: docker
    plan: free
    # POT_PROVIDER_URL задаётся ВРУЧНУЮ в Render → Environment (не через
    # fromService — та связка ломается, если сервисы оказались в разных
    # "Projects"/группах). Значение — публичный URL сервиса
    # videovault-pot-provider ниже, например:
    # https://videovault-pot-provider.onrender.com

  - type: web
    name: videovault-pot-provider
    runtime: image
    image:
      url: docker.io/brainicism/bgutil-ytdlp-pot-provider:latest
    plan: free
